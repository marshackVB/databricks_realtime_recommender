# =============================================================================
# Realtime Recommender — Configuration Template
#
# Copy this file to config.yml and fill in workspace-specific values.
# config.yml is gitignored and should never be committed.
# =============================================================================

# Workspace
# The full URL of your Databricks workspace (no trailing slash).
workspace_host: https://<your-workspace>.cloud.databricks.com

# Secret scopes
# Service principal scope must contain keys: client-id, client-secret.
# The SP needs CAN_QUERY on the serving endpoint and USE CATALOG / USE SCHEMA /
# SELECT on the feature schema. See 04_two_tower_deploy for grant statements.
sp_secret_scope: <your-sp-scope>
# Kaggle scope must contain keys: kaggle_username, kaggle_api_key.
# Only needed for 01_download_datasets.
kaggle_secret_scope: <your-kaggle-scope>

# Unity Catalog parameters
catalog: <your-catalog>
schema: recommender_features
volume: recommender_data
ecommerce_table: ecommerce_clickstream
product_table: ecommerce_product
product_train_table: two_tower_fv_train_product
session_train_table: two_tower_fv_train_session
eval_table: two_tower_fv_eval
vs_endpoint: vs_endpoint
vs_index_name: product_embeddings
# Path to your MLflow experiment. Update the username to match your workspace.
mlflow_experiment: /Users/<your-email>/two_tower
# Name for the Lakebase online feature store.
online_store: recommender-features

# Materialization parameters
# true = frequent cron (every 5 min) for fast iteration; false = production schedules.
dev_mode: true

# Training parameters
training_start_day: 2019-11-01
training_end_day: 2019-11-01
evaluation_start_day: 2019-11-02
evalauation_end_day: 2019-11-02
num_epochs: 1
embed_dim: 64
batch_size: 2048

# Model deployment
# Set this to the Stage 1 MLflow run ID you want to promote to Stage 2.
# Leave blank until you have completed a training run in 03_two_tower_train_log.
run_id_to_deploy: